version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: deliverylink_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - deliverylink_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - deliverylink_internal
    # No public port mapping in production - only reachable by the backend container.

  redis:
    image: redis:7-alpine
    container_name: deliverylink_redis_prod
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - deliverylink_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - deliverylink_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: deliverylink-backend:latest
    container_name: deliverylink_backend_prod
    restart: always
    env_file:
      - ../backend/.env.production
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deliverylink_internal
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5
    volumes:
      - deliverylink_uploads:/usr/src/app/tmp/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: deliverylink_nginx_prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - deliverylink_internal

networks:
  deliverylink_internal:
    driver: bridge

volumes:
  deliverylink_pg_data:
  deliverylink_redis_data:
  deliverylink_uploads:
