worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  # Basic DDoS/abuse mitigation at the edge, in addition to the
  # application-level rate limiter in Express.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream deliverylink_backend {
    # Docker Compose service discovery load-balances across replicas automatically
    # when using the service name here.
    server backend:4000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production once a certificate is provisioned.
    # return 301 https://$host$request_uri;

    location / {
      limit_req zone=api_limit burst=40 nodelay;

      proxy_pass http://deliverylink_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
    }

    location /health {
      access_log off;
      proxy_pass http://deliverylink_backend;
    }
  }

  # HTTPS server - uncomment and point at real certs (e.g. Let's Encrypt via certbot)
  # server {
  #   listen 443 ssl http2;
  #   server_name api.deliverylink.example;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #
  #   location / {
  #     limit_req zone=api_limit burst=40 nodelay;
  #     proxy_pass http://deliverylink_backend;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
}
